{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Activated</title>
    <link rel="stylesheet" href="{% static 'css/successful-activation.css' %}">
</head>
<body>

    <div class="card">
        <!-- Left panel (illustration / branding) -->
        <div class="left">
            <div class="brand">
                <div class="logo checkmark">
                    <span><img src="{% static 'img/logo.png'%}" height="32px" width="32px" alt=""></span>
                </div>
                <span>SwyftTask</span>
            </div>
            <div class="illustration">
                Account activated successfully! 🎉
            </div>
        </div>

        <!-- Right panel (message + action) -->
        <div class="right panel">
            <h2>Account Activated</h2>
            <p>Your account has been activated. You can now log in to access your dashboard.</p>

            <div class="actions">
                <a href="{% url 'accounts.login' %}">
                    <button class="btn btn-primary">Proceed to Login</button>
                </a>
            </div>

            <div class="message ok">
                Your account is ready!
            </div>
        </div>
    </div>

</body>
</html>
