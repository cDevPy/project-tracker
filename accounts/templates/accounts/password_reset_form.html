{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create New Password</title>
  <link rel="stylesheet" href="{% static 'css/password_reset_form.css' %}">
</head>
<body>

  <div class="card">
    <div class="brand">
      <div class="logo"><img src="{% static 'img/logo.png'%}" alt="" height="32px" width="32px"></div>
      <div class="brand-name">Swyft Task</div>
    </div>

    <h2>Create New Password</h2>

    <form method="POST" id="passwordForm">
      {% csrf_token %}

      <div>
        <label>New Password</label>
        <div class="input-wrap">
          <input type="password" name="password1" id="password1" required autocomplete="new-password">
          <button type="button" class="toggle-password" data-target="password1">👁️</button>
        </div>
        <div class="password-strength"><div class="strength-bar"></div></div>
        <div class="strength-text" id="strengthText">Enter a strong password</div>
      </div>

      <div>
        <label>Confirm Password</label>
        <div class="input-wrap">
          <input type="password" name="password2" id="password2" required autocomplete="new-password">
          <button type="button" class="toggle-password" data-target="password2">👁️</button>
        </div>
      </div>

      <div class="message" id="message"></div>

      <button type="submit" class="btn" id="submitBtn">Reset Password</button>
    </form>
  </div>

  <script src="{% static 'js/password_reset_form.js'%}"></script>
</body>
</html>
