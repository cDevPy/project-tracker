{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link rel="stylesheet" href="{% static 'css/password_reset_request.css' %}">

    <!-- Inline styles for alert (you can move these to your CSS file later) -->
    
</head>
<body>

<main class="auth-wrapper">
    <div class="auth-card">
        <h2 class="auth-title">Reset Password</h2>
        <p class="auth-subtitle">
            Enter your email address and we’ll send you a reset PIN.
        </p>

        <!-- ERROR MESSAGE (when email doesn't exist or other errors) -->
        {% if template_data.error %}
            <div class="alert alert-danger" role="alert">
                {{ template_data.error }}
            </div>
        {% endif %}

        <!-- SUCCESS MESSAGE (e.g., after redirect from other steps) -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="auth-form">
            {% csrf_token %}

            <div class="field-group">
                <label for="email">
                    <i class="icon">@</i>
                    Email address
                </label>
                <input type="email" id="email" name="email" placeholder="you@example.com"value="{{ request.POST.email }}" required>
                
            </div>

            <button type="submit" class="primary-btn">
                Send Reset PIN
            </button>
        </form>

        <p style="text-align: center; margin-top: 20px;">
            <a href="{% url 'accounts.login' %}" class="auth-link">Back to Login</a>
        </p>
    </div>
</main>

<script src="{% static 'js/password_reset_request.js' %}"></script>
</body>
</html>
