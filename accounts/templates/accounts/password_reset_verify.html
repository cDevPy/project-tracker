{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Enter OTP — Secure Verification</title>
<link rel="stylesheet" href="{% static 'css/password-reset-verify.css' %}">
</head>

<body>
<main class="card" role="main">

<section class="left">
  <div class="brand">
    <div class="logo">
      <img src="{% static 'img/logo.png' %}" alt="SwyftTask logo" style="width:32px;height:32px;">
    </div>
    <div>
      <div style="font-weight:700">SwyftTask</div>
      <div style="font-size:13px;color:var(--muted)">Secure login • One-time passcode</div>
    </div>
  </div>
</section>

<section class="right">
  <div class="panel">
    <h2>Verify your email</h2>
    <p>Enter the 4-digit code we sent to your email.</p>

    <!-- ✅ FORM STARTS HERE -->
    <form method="POST" action="{% url 'password_reset_verify' %}">
      {% csrf_token %}
      <input type="hidden" name="email" value="{{ email }}">

      <label class="small">One-time passcode</label>
      <div class="otp-wrap">
        <input name="d1" maxlength="1" class="otp-input" required>
        <input name="d2" maxlength="1" class="otp-input" required>
        <input name="d3" maxlength="1" class="otp-input" required>
        <input name="d4" maxlength="1" class="otp-input" required>
      </div>
      
      {% if error %}
        <div class="otp-error">
          {{ error }}
        </div>
      {% endif %}


      <div class="actions">
        <button type="submit" class="btn btn-primary">Verify</button>
        <button type="reset" class="btn btn-ghost">Clear</button>
      </div>
    </form>
    <!-- ✅ FORM ENDS HERE -->

    <div class="footer-row">
      <span class="small">Didn't get it?</span>
      <a href="{% url 'password_reset_request' %}" class="resend">
        Resend code
      </a>
    </div>

  </div>
</section>

</main>
  <script src="{% static 'js/password_reset_verify.js'%}"></script>
</body>
</html>
