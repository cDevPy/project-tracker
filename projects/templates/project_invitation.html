<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Project Invitation</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px;">
        <h2>You've been invited to join <strong>{{ project_name }}</strong></h2>
        <p><strong>{{ inviter_name }}</strong> has invited you to join the project as a <strong>{{ role }}</strong>.</p>
        
        <a href="{{ accept_url }}" 
           style="display: inline-block; background-color: #2563eb; color: white; padding: 14px 28px; 
                  text-decoration: none; border-radius: 6px; font-weight: bold; margin: 20px 0;">
            Accept Invitation
        </a>
        
        <p style="margin-top: 30px; color: #555;">
            Or copy this code and enter it manually: <strong>{{ token }}</strong>
        </p>
        
        <p style="color: #666; font-size: 14px;">
            This invitation will expire in 7 days.
        </p>
    </div>
</body>
</html>
